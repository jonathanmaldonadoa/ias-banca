@if (loading) {
  <div class="spinner-container">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
} @else {
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>Número</th>
        <td mat-cell *matCellDef="let cuenta">{{ cuenta.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="condicion">
        <th mat-header-cell *matHeaderCellDef>Condición</th>
        <td mat-cell *matCellDef="let cuenta">{{ cuenta.condicion }}</td>
      </ng-container>

      <ng-container matColumnDef="saldo">
        <th mat-header-cell *matHeaderCellDef>Saldo</th>
        <td mat-cell *matCellDef="let cuenta">{{ cuenta.saldo | number: '1.2-2' }}</td>
      </ng-container>

      <ng-container matColumnDef="limiteDiario">
        <th mat-header-cell *matHeaderCellDef>Límite diario</th>
        <td mat-cell *matCellDef="let cuenta">{{ cuenta.limiteDiario | number: '1.2-2' }}</td>
      </ng-container>

      <ng-container matColumnDef="moneda">
        <th mat-header-cell *matHeaderCellDef>Moneda</th>
        <td mat-cell *matCellDef="let cuenta">{{ cuenta.moneda }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iasdb
      POSTGRES_USER: ias
      POSTGRES_PASSWORD: ias
    ports:
      - "5432:5432"
    volumes:
      - ias-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ias -d iasdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ias-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ias
      RABBITMQ_DEFAULT_PASS: ias
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ias-rabbitmq-data:/var/lib/rabbitmq

volumes:
  ias-postgres-data:
  ias-rabbitmq-data:
